version: 2

updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      root-images:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /opencode
    schedule:
      interval: weekly
    groups:
      opencode-image:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /ingest
    schedule:
      interval: weekly
    groups:
      ingest-image:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
