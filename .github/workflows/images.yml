name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without a leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate primary chat before publication
        run: |
          docker build --target opencode -t kw-opencode:integration -f opencode/Dockerfile .
          docker build --target openchamber -t kw-openchamber:integration -f opencode/Dockerfile .
          sh tests/integration/chat.sh
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            printf 'Invalid SemVer version: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) printf 'target=release\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'target=stable\n' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and publish images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          BAKE_TARGET: ${{ steps.version.outputs.target }}
        run: sh scripts/publish-images.sh "$BAKE_TARGET"
