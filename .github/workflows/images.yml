name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without a leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            printf 'Invalid SemVer version: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) printf 'target=release\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'target=stable\n' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and publish images
        uses: docker/bake-action@v6
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ steps.version.outputs.target }}
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64
