name: Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: pre-release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps ./ingest/core ./ingest/webdav ./ingest/paperless ./ingest/audio ./ingest/speech
          python -m unittest discover -s tests -v
          node --test tests/test_wiki_ingest_status.mjs tests/test_contract_fixtures.mjs tests/test_wiki_ingest_journal.mjs tests/test_ingest_context_budget.mjs
          node --test tests/test_chat_bootstrap.mjs
          (cd ingest && python -m unittest discover -s tests -v)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Python tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned ShellCheck
        run: |
          scripts/install-shellcheck.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run lint and formatting checks
        run: scripts/lint.sh

  chat-integration:
    name: Primary chat integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Docker Hub mirror for daemon builds
        run: sh scripts/setup-ci-docker.sh
      - name: Build and test chat images
        run: |
          docker build --target opencode -t kw-opencode:integration -f opencode/Dockerfile .
          docker build --target openchamber -t kw-openchamber:integration -f opencode/Dockerfile .
          sh tests/integration/chat.sh

  pre-release:
    name: Pre-release
    needs: [tests, lint, chat-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Docker Hub mirror for builder bootstrap
        run: sh scripts/setup-ci-docker.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/docker/buildkitd.toml
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute pre-release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(sed -n 's/^## \[\([0-9][0-9.]*\)\]-unreleased$/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$base" ]; then
            if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              printf 'No [x.y.z]-unreleased or [Unreleased] heading found in CHANGELOG.md\n' >&2
              exit 1
            fi
            last=$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [ -z "$last" ]; then
              base="0.0.1"
            else
              base=$(printf '%s' "$last" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
            fi
          fi
          version=""
          for candidate in $(seq 0 99); do
            candidate="${base}-pre.${candidate}"
            if ! gh release view "v${candidate}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              version="$candidate"
              break
            fi
          done
          if [ -z "$version" ]; then
            printf 'No free pre-release version under %s\n' "$base" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -f "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}" --force
      - name: Build and publish pre-release images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/publish-images.sh release
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk '/^## \[/{found++} found==1' CHANGELOG.md | head -n 200)
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --prerelease \
            --notes "$notes"
