name: Pre-release

on:
  workflow_call:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: pre-release
  cancel-in-progress: false

jobs:
  pre-release:
    name: Pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: release-image-metadata
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute pre-release version
        id: version
        run: |
          base=$(sed -n 's/^## \[\([0-9][0-9.]*\)\]-unreleased$/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$base" ]; then
            if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              printf 'No [x.y.z]-unreleased or [Unreleased] heading found in CHANGELOG.md\n' >&2
              exit 1
            fi
            last=$(git tag --list --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            if [ -z "$last" ]; then
              base="0.0.1"
            else
              base=$(printf '%s' "$last" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
            fi
          fi
          version=$(python3 scripts/next-prerelease.py "$base")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "v${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/v${VERSION}"
      - name: Promote tested CI images by digest without rebuilding
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/promote-images.py image-metadata.json
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk '/^## \[/{found++} found==1' CHANGELOG.md | head -n 200)
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --prerelease \
            --notes "$notes"
