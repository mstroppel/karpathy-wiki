name: CI
run-name: "CI${{ inputs.pull_request_number && format(' (PR #{0} preview)', inputs.pull_request_number) || '' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number for an OpenCode update preview build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e ./ingest/core -e ./ingest/webdav -e ./ingest/paperless -e ./ingest/audio -e ./ingest/speech -e ./ingest/email
          scripts/test-python.sh
          npm test
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Python tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned ShellCheck
        run: |
          scripts/install-shellcheck.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run lint and formatting checks
        run: scripts/lint.sh

  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: compose
            images: opencode ingest ingest-webdav ingest-paperless
            script: tests/integration/run.sh
          - suite: email
            images: ingest-email
            script: tests/integration/email.sh
          - suite: launcher-backup
            images: ''
            script: tests/integration/launcher-backup.sh
          - suite: chat
            images: opencode openchamber
            script: tests/integration/chat.sh
          - suite: batch-ingest
            images: opencode
            script: tests/integration/batch-ingest.sh
          - suite: runtime-write-isolation
            images: opencode
            script: tests/integration/runtime-write-isolation.sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure Docker Hub mirror for daemon and builder
        run: sh scripts/setup-ci-docker.sh
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/docker/buildkitd.toml
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Load cached integration images
        if: matrix.images != ''
        env:
          BUILD_CACHE: gha
          IMAGES: ${{ matrix.images }}
        run: |
          # Intentional splitting of the fixed, repository-owned image list.
          # shellcheck disable=SC2086
          sh scripts/build-integration-images.sh $IMAGES
      - name: Run isolated integration suite
        env:
          SKIP_IMAGE_BUILD: '1'
          SCRIPT: ${{ matrix.script }}
        run: sh "$SCRIPT"

  integration-gate:
    # Keep the existing branch-protection check name while expanding the matrix.
    name: Compose integration
    runs-on: ubuntu-latest
    needs: [integration]
    if: always()
    steps:
      - env:
          RESULT: ${{ needs.integration.result }}
        run: test "$RESULT" = success

  images:
    name: Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure Docker Hub mirror for builder bootstrap
        run: sh scripts/setup-ci-docker.sh
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/docker/buildkitd.toml
      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        id: build
        uses: docker/bake-action@v7
        env:
          BUILD_CACHE: gha
          IMAGE_VERSION: ${{ github.event_name == 'push' && format('sha-{0}', github.sha) || format('pr-{0}', github.event.number || inputs.pull_request_number) }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '') && 'release' || 'default' }}
          load: false
          push: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '') }}
      - name: Save immutable image digests for release promotion
        if: fromJSON(steps.build.outputs.metadata)['opencode-release'] != null
        # Export only the eight digests, not provenance or other unbounded data.
        # Run on PRs too so the release artifact path is covered before merging.
        env:
          DIGEST_opencode: ${{ fromJSON(steps.build.outputs.metadata)['opencode-release']['containerimage.digest'] }}
          DIGEST_openchamber: ${{ fromJSON(steps.build.outputs.metadata)['openchamber-release']['containerimage.digest'] }}
          DIGEST_ingest: ${{ fromJSON(steps.build.outputs.metadata)['ingest-release']['containerimage.digest'] }}
          DIGEST_ingest_webdav: ${{ fromJSON(steps.build.outputs.metadata)['ingest-webdav-release']['containerimage.digest'] }}
          DIGEST_ingest_audio: ${{ fromJSON(steps.build.outputs.metadata)['ingest-audio-release']['containerimage.digest'] }}
          DIGEST_ingest_speech: ${{ fromJSON(steps.build.outputs.metadata)['ingest-speech-release']['containerimage.digest'] }}
          DIGEST_ingest_paperless: ${{ fromJSON(steps.build.outputs.metadata)['ingest-paperless-release']['containerimage.digest'] }}
          DIGEST_ingest_email: ${{ fromJSON(steps.build.outputs.metadata)['ingest-email-release']['containerimage.digest'] }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              name.removeprefix("DIGEST_").replace("_", "-") + "-release": {
                  "containerimage.digest": value
              }
              for name, value in os.environ.items() if name.startswith("DIGEST_")
          }
          Path("image-metadata.json").write_text(json.dumps(metadata) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        if: fromJSON(steps.build.outputs.metadata)['opencode-release'] != null
        with:
          name: release-image-metadata
          path: image-metadata.json
          if-no-files-found: error

  pre-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, lint, integration-gate, images]
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/pre-release.yml
