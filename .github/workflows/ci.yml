name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run unit tests
        run: |
          python -m pip install --no-deps ./ingest/core ./ingest/webdav ./ingest/paperless
          python -m unittest discover -s tests -v
          node --test tests/test_wiki_ingest_status.mjs tests/test_contract_fixtures.mjs
          (cd ingest && python -m unittest discover -s tests -v)

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Python tooling
        run: python -m pip install -r requirements-dev.txt
      # ShellCheck is preinstalled on the runner image; no archive download.
      - name: Run lint and formatting checks
        run: scripts/lint.sh

  integration:
    name: Compose integration
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Run disposable Compose stack test
        run: tests/integration/run.sh

  images:
    name: Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        uses: docker/bake-action@v7
        env:
          IMAGE_VERSION: pr-${{ github.event.number }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'release' || 'default' }}
          load: false
          push: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
