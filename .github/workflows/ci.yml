name: CI
run-name: "CI${{ inputs.pull_request_number && format(' (PR #{0} preview)', inputs.pull_request_number) || '' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number for an OpenCode update preview build
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e ./ingest/core -e ./ingest/webdav -e ./ingest/paperless -e ./ingest/audio -e ./ingest/speech
          scripts/test-python.sh
          node --test tests/test_wiki_ingest_status.mjs tests/test_contract_fixtures.mjs tests/test_wiki_ingest_journal.mjs tests/test_ingest_context_budget.mjs tests/test_wiki_ingest_transaction.mjs tests/test_answer_intake.mjs
          node --test tests/test_chat_bootstrap.mjs
          node --test tests/test_trusted_publisher.mjs
          node --test tests/test_manual_ingest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Python tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned ShellCheck
        run: |
          scripts/install-shellcheck.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run lint and formatting checks
        run: scripts/lint.sh

  integration:
    name: Compose integration
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Configure Docker Hub mirror for daemon builds
        # Configure the daemon too: Compose pulls and docker build do not use
        # the container BuildKit configuration in the images job.
        run: sh scripts/setup-ci-docker.sh
      - name: Run disposable Compose stack test
        run: tests/integration/run.sh
      - name: Run primary chat integration
        run: |
          docker build --target openchamber -t kw-openchamber:integration -f opencode/Dockerfile .
          sh tests/integration/chat.sh
      - name: Reproduce auto-ingest writer-gate blocker (not release approval)
        run: sh tests/integration/auto-ingest-runtime.sh
      - name: Prove kernel-enforced runtime write isolation
        run: sh tests/integration/runtime-write-isolation.sh
      - name: Prove isolated trusted publication and crash recovery
        run: |
          docker build --target publisher -t kw-publisher:integration -f opencode/Dockerfile .
          sh tests/integration/trusted-publisher.sh
      - name: Prove UI-only trusted manual ingest with synthetic model proposals
        run: sh tests/integration/manual-ingest.sh

  images:
    name: Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure Docker Hub mirror for builder bootstrap
        run: sh scripts/setup-ci-docker.sh
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/docker/buildkitd.toml
      - name: Log in to GHCR
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        uses: docker/bake-action@v7
        env:
          IMAGE_VERSION: pr-${{ github.event.number || inputs.pull_request_number }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '') && 'release' || 'default' }}
          load: false
          push: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '') }}
