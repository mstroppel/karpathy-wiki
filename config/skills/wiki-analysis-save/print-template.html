<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{titel}}</title>
    <style>
      :root {
        --ink: #1a202c;
        --muted: #4a5568;
        --accent: #2b6cb0;
        --border: #cbd5e0;
        --surface: #f7fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
        max-width: 46rem;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 12pt;
        line-height: 1.65;
        color: var(--ink);
        background: #ffffff;
      }
      .doc-header {
        border-bottom: 2px solid var(--ink);
        margin-bottom: 2rem;
        padding-bottom: 1rem;
      }
      .doc-header h1 {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 1.55rem;
        line-height: 1.25;
        margin: 0 0 0.4rem;
      }
      .doc-meta {
        color: var(--muted);
        font-size: 0.85rem;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      .toolbar {
        position: fixed;
        top: 1rem;
        right: 1rem;
      }
      .toolbar button {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }
      .toolbar button:hover {
        filter: brightness(1.1);
      }
      main h2 {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 1.15rem;
        margin: 1.8rem 0 0.5rem;
        padding-bottom: 0.2rem;
        border-bottom: 1px solid var(--border);
      }
      main h3 {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 1rem;
        margin: 1.4rem 0 0.4rem;
      }
      main p {
        margin: 0.6rem 0;
      }
      main ul,
      main ol {
        margin: 0.6rem 0;
        padding-left: 1.5rem;
      }
      main li {
        margin: 0.25rem 0;
      }
      main a {
        color: var(--accent);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      main a:hover {
        text-decoration: underline;
      }
      main blockquote {
        margin: 1rem 0;
        padding: 0.25rem 1rem;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      main code {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace;
        font-size: 0.88em;
        background: var(--surface);
        padding: 0.08em 0.3em;
        border-radius: 3px;
      }
      main pre {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        font-size: 0.88em;
      }
      main pre code {
        background: none;
        padding: 0;
      }
      main table {
        border-collapse: collapse;
        width: 100%;
        margin: 1rem 0;
        font-size: 0.92em;
      }
      main th,
      main td {
        border: 1px solid var(--border);
        padding: 0.35rem 0.6rem;
        text-align: left;
        vertical-align: top;
      }
      main th {
        background: #edf2f7;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      main hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.5rem 0;
      }
      .doc-footer {
        margin-top: 2.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.8rem;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      @media print {
        @page {
          size: A4;
          margin: 20mm 18mm;
        }
        body {
          max-width: none;
          padding: 0;
          font-size: 10.5pt;
        }
        .toolbar {
          display: none;
        }
        main h2,
        main h3 {
          break-after: avoid-page;
          page-break-after: avoid;
        }
        main p,
        main li,
        main tr,
        main blockquote {
          break-inside: avoid-page;
          page-break-inside: avoid;
        }
        main a[href^='http']::after {
          content: ' (' attr(href) ')';
          font-size: 0.78em;
          color: var(--muted);
          overflow-wrap: anywhere;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button type="button" onclick="window.print()">Als PDF speichern</button>
    </div>
    <header class="doc-header">
      <h1>{{titel}}</h1>
      <div class="doc-meta">
        Analyse vom {{datum}} · <a href="{{seiten_url}}">{{seiten_url}}</a>
      </div>
    </header>
    <main>{{inhalt}}</main>
    <footer class="doc-footer">
      Aus {{wiki_name}} erzeugte Analyse · Quelle: <a href="{{seiten_url}}">{{seiten_url}}</a>
    </footer>
  </body>
</html>
