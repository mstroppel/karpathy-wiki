[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karpathy-wiki-ingest-audio"
version = "0.1.0"
description = "WebDAV audio ingest plugin for Karpathy Wiki: local transcription, redaction, and publication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["karpathy-wiki-ingest==0.1.0", "karpathy-wiki-speech==0.1.0"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Source = "https://github.com/mstroppel/karpathy-wiki"

[project.entry-points."karpathy_wiki_ingest.plugins"]
audio = "karpathy_wiki_ingest_audio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
