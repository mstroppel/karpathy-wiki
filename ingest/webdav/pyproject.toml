[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karpathy-wiki-ingest-webdav"
version = "0.1.0"
description = "WebDAV ingest plugin for Karpathy Wiki: rclone synchronization and anonymization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["karpathy-wiki-ingest==0.1.0"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Source = "https://github.com/mstroppel/karpathy-wiki"

[project.entry-points."karpathy_wiki_ingest.plugins"]
webdav = "karpathy_wiki_ingest_webdav:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
