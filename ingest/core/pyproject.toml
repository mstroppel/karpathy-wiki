[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karpathy-wiki-ingest"
version = "0.1.0"
description = "Shared core for Karpathy-Wiki ingest plugins: anonymization, atomic writes, health, and plugin dispatch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Source = "https://github.com/mstroppel/karpathy-wiki"

[project.scripts]
karpathy-wiki-ingest = "karpathy_wiki_ingest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
