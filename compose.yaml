name: ${COMPOSE_PROJECT_NAME:-karpathy-wiki}

services:
  init:
    image: ghcr.io/mstroppel/karpathy-wiki-opencode:${KARPATHY_WIKI_VERSION:-latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/etc/opencode/init.sh"]
    environment:
      WIKI_NAME: ${WIKI_NAME:-Karpathy Wiki}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.example.com}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Karpathy Wiki Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-karpathy-wiki@localhost}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_ROOT:-./data}:/knowledge:rw
    security_opt:
      - no-new-privileges:true

  webdav-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest-webdav:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["webdav"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WEBDAV_PATH: ${WEBDAV_PATH:-Wiki Sources}
      WEBDAV_SYNC_INTERVAL: ${WEBDAV_SYNC_INTERVAL:-15m}
      REDACTIONS_FILE: /run/secrets/redactions
      HEALTH_PATH: /tmp/health.json
      INGEST_STATE_PATH: /data/state/ingest.sqlite3
      RCLONE_CONFIG_WEBDAV_TYPE: webdav
      RCLONE_CONFIG_WEBDAV_URL: ${WEBDAV_URL:-https://cloud.example.com/remote.php/dav/files/username/}
      RCLONE_CONFIG_WEBDAV_VENDOR: ${WEBDAV_VENDOR:-nextcloud}
      RCLONE_CONFIG_WEBDAV_USER: ${WEBDAV_USERNAME:-username}
      RCLONE_CONFIG_WEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED:-}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_ROOT:-./data}/incoming/webdav:/data/incoming/webdav:rw
      - ${DATA_ROOT:-./data}/sources/webdav:/data/sanitized/webdav:rw
      - ${DATA_ROOT:-./data}/quarantine/webdav:/data/quarantine/webdav:rw
      - ${DATA_ROOT:-./data}/state:/data/state:rw
    secrets:
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_ingest.health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m
    security_opt:
      - no-new-privileges:true

  audio-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest-audio:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["audio"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WEBDAV_PATH: ${AUDIO_WEBDAV_PATH:-Recordings}
      RCLONE_CONFIG_WEBDAV_TYPE: webdav
      RCLONE_CONFIG_WEBDAV_URL: ${WEBDAV_URL:-https://cloud.example.com/remote.php/dav/files/username/}
      RCLONE_CONFIG_WEBDAV_VENDOR: ${WEBDAV_VENDOR:-nextcloud}
      RCLONE_CONFIG_WEBDAV_USER: ${WEBDAV_USERNAME:-username}
      RCLONE_CONFIG_WEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED:-}
      WEBDAV_SYNC_INTERVAL: ${AUDIO_SYNC_INTERVAL:-1h}
      REDACTIONS_FILE: /run/secrets/redactions
      HEALTH_PATH: /tmp/health.json
      INGEST_STATE_PATH: /data/state/ingest.sqlite3
      AUDIO_SYNC_INTERVAL: ${AUDIO_SYNC_INTERVAL:-1h}
      AUDIO_LANGUAGE: ${AUDIO_LANGUAGE:-}
      AUDIO_DIARIZE: ${AUDIO_DIARIZE:-0}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES}
      AUDIO_MAX_DURATION_SECONDS: ${AUDIO_MAX_DURATION_SECONDS}
      SPEECH_ROOT: /data/speech
      SPEECH_TIMEOUT_SEC: ${SPEECH_TIMEOUT_SEC:-43200}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_ROOT:-./data}/incoming/audio:/data/incoming/audio:rw
      - ${DATA_ROOT:-./data}/speech:/data/speech:rw
      - ${DATA_ROOT:-./data}/sources/audio:/data/sanitized/audio:rw
      - ${DATA_ROOT:-./data}/quarantine/audio:/data/quarantine/audio:rw
      - ${DATA_ROOT:-./data}/state:/data/state:rw
    secrets:
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
      audio-speech:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_ingest.health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  audio-speech:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest-speech:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["audio"]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["python", "-m", "karpathy_wiki_speech"]
    environment:
      TZ: ${TZ:-UTC}
      SPEECH_ROOT: /data/speech
      SPEECH_BACKEND: ${SPEECH_BACKEND:-faster-whisper}
      SPEECH_MODEL: ${SPEECH_MODEL:-small}
      SPEECH_DEVICE: ${SPEECH_DEVICE:-cpu}
      SPEECH_COMPUTE_TYPE: ${SPEECH_COMPUTE_TYPE:-int8}
      SPEECH_POLL_SECONDS: ${SPEECH_POLL_SECONDS:-5}
      SPEECH_MAX_BYTES: ${AUDIO_MAX_BYTES}
      SPEECH_MAX_DURATION_SECONDS: ${AUDIO_MAX_DURATION_SECONDS}
      # Opt-in hosted transcription (SPEECH_BACKEND=mistral): the worker-only
      # API secret is mounted below and never reaches the audio provider.
      SPEECH_MISTRAL_MODEL: ${SPEECH_MISTRAL_MODEL:-}
      SPEECH_MISTRAL_BASE_URL: ${SPEECH_MISTRAL_BASE_URL:-}
      SPEECH_MISTRAL_TIMEOUT_SECONDS: ${SPEECH_MISTRAL_TIMEOUT_SECONDS:-}
      SPEECH_MISTRAL_MAX_ATTEMPTS: ${SPEECH_MISTRAL_MAX_ATTEMPTS:-}
      SPEECH_MISTRAL_MAX_BYTES: ${SPEECH_MISTRAL_MAX_BYTES:-}
      SPEECH_MISTRAL_MAX_DURATION_SECONDS: ${SPEECH_MISTRAL_MAX_DURATION_SECONDS:-}
      MISTRAL_API_KEY_FILE: /run/secrets/mistral_api_key
      HF_HOME: /models
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
    volumes:
      - ${DATA_ROOT:-./data}/speech:/data/speech:rw
      - ${DATA_ROOT:-./data}/models/audio:/models:rw
    secrets:
      - mistral_api_key
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_speech",
             "--health-check", "/data/speech/worker-health.json"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  answers-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["answers"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    entrypoint: ["python", "-m", "karpathy_wiki_ingest.answers"]
    environment:
      REDACTIONS_FILE: /run/secrets/redactions
      HEALTH_PATH: /tmp/health.json
      ANSWERS_SYNC_INTERVAL: ${ANSWERS_SYNC_INTERVAL:-15}
      SYNC_INTERVAL_SECONDS: ${ANSWERS_SYNC_INTERVAL:-15}
    volumes:
      - ${DATA_ROOT:-./data}/incoming/answers:/data/incoming/answers:ro
      - ${DATA_ROOT:-./data}/sources/answers:/data/sanitized/answers:rw
    secrets:
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_ingest.health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  paperless-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest-paperless:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["paperless"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-https://paperless.example.com}
      PAPERLESS_SOURCE_TAG_ID: ${PAPERLESS_SOURCE_TAG_ID:-0}
      PAPERLESS_TOKEN_FILE: /run/secrets/paperless_token
      REDACTIONS_FILE: /run/secrets/redactions
      SYNC_INTERVAL_SECONDS: ${PAPERLESS_SYNC_INTERVAL_SECONDS:-900}
      SANITIZED_ROOT: /data/sanitized/paperless
      QUARANTINE_ROOT: /data/quarantine/paperless
      HEALTH_PATH: /tmp/health.json
      INGEST_STATE_PATH: /data/state/ingest.sqlite3
    volumes:
      - ${DATA_ROOT:-./data}/sources/paperless:/data/sanitized/paperless:rw
      - ${DATA_ROOT:-./data}/quarantine/paperless:/data/quarantine/paperless:rw
      - ${DATA_ROOT:-./data}/state:/data/state:rw
    secrets:
      - paperless_token
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_ingest.health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  opencode:
    image: ghcr.io/mstroppel/karpathy-wiki-opencode:${KARPATHY_WIKI_VERSION:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /knowledge/wiki
    environment:
      HOME: /home/opencode
      TZ: ${TZ:-UTC}
      OPENCODE_CONFIG: /etc/opencode/opencode.json
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?OPENCODE_PASSWORD is required by OpenCode v2}
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
      WIKI_INGEST_BATCH_BUDGET_TOKENS: ${WIKI_INGEST_BATCH_BUDGET_TOKENS:-32000}
      WIKI_INGEST_BATCH_MAX_SOURCES: ${WIKI_INGEST_BATCH_MAX_SOURCES:-4}
      WIKI_INGEST_RUN_MAX_BATCHES: ${WIKI_INGEST_RUN_MAX_BATCHES:-12}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
    volumes:
      - ${DATA_ROOT:-./data}/sources:/knowledge/sources:ro
      - ${DATA_ROOT:-./data}/incoming/answers:/knowledge/incoming/answers:rw
      - ${DATA_ROOT:-./data}/incoming/ingest-journal:/knowledge/incoming/ingest-journal:rw
      - ${DATA_ROOT:-./data}/wiki:/knowledge/wiki:rw
      - ${DATA_ROOT:-./data}/opencode/config:/home/opencode/.config/opencode:rw
      - ${DATA_ROOT:-./data}/opencode/data:/home/opencode/.local/share/opencode:rw
      - ${DATA_ROOT:-./data}/opencode/state:/home/opencode/.local/state:rw
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$$OPENCODE_PASSWORD\" http://127.0.0.1:4096/api/info >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m
    extra_hosts:
      - "${PAPERLESS_BLOCKED_HOSTNAME:-paperless.example.invalid}:127.0.0.1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  openchamber:
    image: ghcr.io/mstroppel/karpathy-wiki-openchamber:${KARPATHY_WIKI_VERSION:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    working_dir: /knowledge/wiki
    environment:
      HOME: /home/openchamber
      TZ: ${TZ:-UTC}
      WIKI_NAME: ${WIKI_NAME:-Karpathy Wiki}
      OPENCHAMBER_DATA_DIR: /home/openchamber/.config/openchamber
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?OPENCHAMBER_UI_PASSWORD is required}
      OPENCODE_HOST: http://opencode:4096
      OPENCODE_SKIP_START: "true"
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:?OPENCODE_PASSWORD is required by OpenCode v2}
      OPENCHAMBER_OPENCODE_CWD: /knowledge/wiki
      OPENCHAMBER_RELAY_HOST: "off"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
    volumes:
      - ${DATA_ROOT:-./data}/wiki:/knowledge/wiki:ro
      - ${DATA_ROOT:-./data}/openchamber:/home/openchamber/.config/openchamber:rw
    depends_on:
      opencode:
        condition: service_healthy
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-openchamber
    healthcheck:
      test: ["CMD", "node", "/etc/openchamber/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.12.0
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SB_READ_ONLY: "1"
      SB_INDEX_PAGE: index
      SB_SPACE_IGNORE: |-
        AGENTS.md
        .git/**
    volumes:
      - ${DATA_ROOT:-./data}/wiki:/space:ro
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-silverbullet
    security_opt:
      - no-new-privileges:true

  raw-files:
    image: caddy:2.11.4-alpine
    profiles: ["raw-files"]
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ${DATA_ROOT:-./data}/sources:/srv:ro
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-raw-files
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

secrets:
  paperless_token:
    file: ${PAPERLESS_TOKEN_FILE:-./secrets/paperless-token}
  redactions:
    file: ${REDACTIONS_FILE:-./secrets/redactions.json}
  # Defaults to the tracked, intentionally empty placeholder so local-only
  # audio starts without any Mistral credential (Compose requires the file to
  # exist). Hosted mode points this at the real key file.
  mistral_api_key:
    file: ${MISTRAL_API_KEY_FILE:-./secrets/mistral-api-key.example}

networks:
  webproxy:
    external: true
    name: ${WEBPROXY_NETWORK:-webproxy}
