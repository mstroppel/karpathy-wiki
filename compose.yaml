name: ${COMPOSE_PROJECT_NAME:-karpathy-wiki}

services:
  init:
    image: ghcr.io/mstroppel/karpathy-wiki-opencode:${KARPATHY_WIKI_VERSION:-latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/etc/opencode/init.sh"]
    environment:
      WIKI_NAME: ${WIKI_NAME:-Karpathy Wiki}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.example.com}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Karpathy Wiki Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-karpathy-wiki@localhost}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_ROOT:-./data}:/knowledge:rw
    security_opt:
      - no-new-privileges:true

  webdav-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest:${KARPATHY_WIKI_VERSION:-latest}
    command: ["webdav"]
    profiles: ["webdav", "nextcloud"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      WEBDAV_PATH: ${WEBDAV_PATH:-${NEXTCLOUD_PATH:-Wiki Sources}}
      WEBDAV_SYNC_INTERVAL: ${WEBDAV_SYNC_INTERVAL:-${NEXTCLOUD_SYNC_INTERVAL:-15m}}
      REDACTIONS_FILE: /run/secrets/redactions
      RCLONE_CONFIG_WEBDAV_TYPE: webdav
      RCLONE_CONFIG_WEBDAV_URL: ${WEBDAV_URL:-${NEXTCLOUD_WEBDAV_URL:-https://cloud.example.com/remote.php/dav/files/username/}}
      RCLONE_CONFIG_WEBDAV_VENDOR: ${WEBDAV_VENDOR:-nextcloud}
      RCLONE_CONFIG_WEBDAV_USER: ${WEBDAV_USERNAME:-${NEXTCLOUD_USERNAME:-username}}
      RCLONE_CONFIG_WEBDAV_PASS: ${WEBDAV_PASSWORD_OBSCURED:-${NEXTCLOUD_PASSWORD_OBSCURED:-}}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${DATA_ROOT:-./data}/incoming/webdav:/data/incoming/webdav:rw
      - ${DATA_ROOT:-./data}/sources/webdav:/data/sanitized/webdav:rw
      - ${DATA_ROOT:-./data}/quarantine/webdav:/data/quarantine/webdav:rw
    secrets:
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  paperless-ingest:
    image: ghcr.io/mstroppel/karpathy-wiki-ingest:${KARPATHY_WIKI_VERSION:-latest}
    command: ["paperless"]
    profiles: ["paperless"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-https://paperless.example.com}
      PAPERLESS_SOURCE_TAG_ID: ${PAPERLESS_SOURCE_TAG_ID:-0}
      PAPERLESS_TOKEN_FILE: /run/secrets/paperless_token
      REDACTIONS_FILE: /run/secrets/redactions
      SYNC_INTERVAL_SECONDS: ${PAPERLESS_SYNC_INTERVAL_SECONDS:-900}
      SANITIZED_ROOT: /data/sanitized/paperless
      QUARANTINE_ROOT: /data/quarantine/paperless
      HEALTH_PATH: /tmp/health.json
    volumes:
      - ${DATA_ROOT:-./data}/sources/paperless:/data/sanitized/paperless:rw
      - ${DATA_ROOT:-./data}/quarantine/paperless:/data/quarantine/paperless:rw
    secrets:
      - paperless_token
      - redactions
    depends_on:
      init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-m", "karpathy_wiki_ingest.health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  opencode:
    image: ghcr.io/mstroppel/karpathy-wiki-opencode:${KARPATHY_WIKI_VERSION:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /knowledge/wiki
    environment:
      HOME: /home/opencode
      TZ: ${TZ:-UTC}
      OPENCODE_CONFIG: /etc/opencode/opencode.json
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
    volumes:
      - ${DATA_ROOT:-./data}/sources:/knowledge/sources:ro
      - ${DATA_ROOT:-./data}/wiki:/knowledge/wiki:rw
      - ${DATA_ROOT:-./data}/opencode/config:/home/opencode/.config/opencode:rw
      - ${DATA_ROOT:-./data}/opencode/data:/home/opencode/.local/share/opencode:rw
      - ${DATA_ROOT:-./data}/opencode/state:/home/opencode/.local/state:rw
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-opencode
    extra_hosts:
      - "${PAPERLESS_BLOCKED_HOSTNAME:-paperless.example.invalid}:127.0.0.1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.10.0
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SB_READ_ONLY: "1"
      SB_INDEX_PAGE: index
      SB_SPACE_IGNORE: |-
        AGENTS.md
        .git/**
    volumes:
      - ${DATA_ROOT:-./data}/wiki:/space:rw
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-silverbullet
    security_opt:
      - no-new-privileges:true

  session-export:
    image: ghcr.io/mstroppel/karpathy-wiki-session-export:${KARPATHY_WIKI_VERSION:-latest}
    profiles: ["session-export"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      HOME: /tmp
      TZ: ${TZ:-UTC}
      OPENCODE_URL: http://opencode:4096
      OPENCODE_DIRECTORY: /knowledge/wiki
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-https://chat.example.com}
      SESSION_EXPORT_REMOTE_PATH: ${WEBDAV_SESSION_PATH:-${NEXTCLOUD_SESSION_PATH:-OpenCode Sessions}}
      SESSION_EXPORT_INTERVAL: ${SESSION_EXPORT_INTERVAL:-15m}
      RCLONE_CONFIG_NEXTCLOUD_TYPE: webdav
      RCLONE_CONFIG_NEXTCLOUD_URL: ${NEXTCLOUD_WEBDAV_URL:-${WEBDAV_URL:-https://cloud.example.com/remote.php/dav/files/username/}}
      RCLONE_CONFIG_NEXTCLOUD_VENDOR: ${NEXTCLOUD_VENDOR:-${WEBDAV_VENDOR:-nextcloud}}
      RCLONE_CONFIG_NEXTCLOUD_USER: ${NEXTCLOUD_USERNAME:-${WEBDAV_USERNAME:-username}}
      RCLONE_CONFIG_NEXTCLOUD_PASS: ${NEXTCLOUD_PASSWORD_OBSCURED:-${WEBDAV_PASSWORD_OBSCURED:-}}
    volumes:
      - ${DATA_ROOT:-./data}/exports/sessions:/exports:rw
    depends_on:
      opencode:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  raw-files:
    image: caddy:2.11.4-alpine
    profiles: ["raw-files"]
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
    volumes:
      - ${DATA_ROOT:-./data}/sources:/srv:ro
    networks:
      default:
      webproxy:
        aliases:
          - ${STACK_ID:-karpathy-wiki}-raw-files
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  paperless_token:
    file: ${PAPERLESS_TOKEN_FILE:-./secrets/paperless-token}
  redactions:
    file: ${REDACTIONS_FILE:-./secrets/redactions.json}

networks:
  webproxy:
    external: true
    name: ${WEBPROXY_NETWORK:-webproxy}
